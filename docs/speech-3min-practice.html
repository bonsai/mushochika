<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3分スピーチ練習</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:auto;padding:30px;line-height:2;background:#f7f4ec;color:#1a1a1a}.timer{font:700 34px monospace}button{padding:8px 16px;margin-right:8px}#main{font-size:28px}.line{color:#b9b2a2}.done{color:#1a1a1a}.cursor{background:#d98e04;color:white}audio{width:100%;margin:16px 0}</style></head>
<body><h1>3分スピーチ練習</h1><div class="timer" id="timer">3:00</div><audio id="audio" controls preload="metadata" src="../tools/speech-3min-analyze.mp3"></audio><button id="start">▶ 再生</button><button id="reset">リセット</button><main id="main"></main><script>
const PARAS=["みなさん、こんにちは。今日のテーマは、「わたしが前職で力を入れたこと」です。","正直に言うと、このテーマに対して、以前の私は後ろ向きでした。思い出せるのは、与えられた仕事をこなし、責任を果たして終わる自分だけ。胸を張って「ここに力を入れた」と言える場面が、見つからなかったんです。","ところが、AI に触れるようになって、考え方が変わりました。AI を道具として使うことで、自分の経験を、前向きに捉えられるようになった。そのきっかけを、今日はお話しします。","このテーマには、ずっと取り組んできました。それでも、全貌をすぐに思い出すことはできませんでした。","そこで僕は、「自分が何をしてきたのか」を分析するツールを作ることにしました。","やり方はこうです。指示文を含むセッションの記録と、成果物のコードを、DB に突っ込んで、ML で計算しました。","すると、結果が出ました。僕が取り組んできたのは、環境整備と、エージェント基盤づくりでした。自分が何に時間を使ってきたのかが、数字として初めて見えたんです。","この経験で気づきました。AI は、人間の苦手なことを補ってくれる、すばらしい伴侶です。記憶が曖昧な僕に代わって、記録から事実を引き出してくれる。そんな道具が、もう手の中にあります。","企業に就職できなくても、個人開発なら、自分で好きな開発を続けていける。そう思えるから、これからも頑張って行きたいです。","この分析ツールは、「ムショチカ」という名前でリポジトリを作り、公開してあります。","ご清聴ありがとうございました。"];const main=document.getElementById('main');const audio=document.getElementById('audio');const spans=[];PARAS.forEach(t=>{const d=document.createElement('p');d.className='line';[...t].forEach(c=>{const s=document.createElement('span');s.textContent=c;d.appendChild(s);spans.push(s)});main.appendChild(d)});let running=false,start=0;function fmt(x){x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}function tick(t){if(!running)return;const p=Math.min(1,(t-start)/180000);document.getElementById('timer').textContent=fmt(180-p*180);const i=Math.min(spans.length-1,Math.floor(p*spans.length));spans.forEach((s,k)=>s.className=k<i?'done':k===i?'cursor':'');if(p<1)requestAnimationFrame(tick);else running=false}document.getElementById('start').onclick=()=>{if(running){running=false;audio.pause();return}running=true;start=performance.now();audio.currentTime=0;audio.play().catch(()=>{});requestAnimationFrame(tick)};document.getElementById('reset').onclick=()=>{running=false;audio.pause();audio.currentTime=0;spans.forEach(s=>s.className='');document.getElementById('timer').textContent='3:00'};
</script></body></html>
