<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3分スピーチ練習</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:auto;padding:30px;line-height:2;background:#f7f4ec;color:#1a1a1a}.timer{font:700 34px monospace}button{padding:8px 16px;margin-right:8px}#main{font-size:28px}.line{color:#b9b2a2}.done{color:#1a1a1a}.cursor{background:#d98e04;color:white}</style></head>
<body><h1>3分スピーチ練習</h1><div class="timer" id="timer">3:00</div><button id="start">▶ 再生</button><button id="reset">リセット</button><audio id="audio" controls preload="metadata" style="width:100%;margin:18px 0"></audio><main id="main"></main><script>
const AUDIO_URL='https://raw.githubusercontent.com/bonsai/mushochika/master/tools/speech-3min-analyze.mp3';
const PARAS=["みなさん、こんにちは。今日のテーマは、「わたしが前職で力を入れたこと」です。","正直に言うと、以前の私は、この質問にうまく答えられませんでした。与えられた仕事をこなし、責任を果たして終わる。その中で、自分が何に力を入れていたのか、はっきりと思い出せなかったんです。","ところが、AIに触れるようになって、考え方が変わりました。思い出せないなら、自分の記録を使って分析すればいい。そう考えて、自分が何をしてきたのかを調べるツールを作りました。","過去のセッションの記録や、実際に作ったコードをデータとして集め、何に時間を使ってきたのかを分析しました。","すると、見えてきたことがありました。僕は、一つのアプリを作って終わるというより、開発を効率化するための環境や、AIエージェントを動かすための仕組みづくりに、多くの時間を使っていたんです。","つまり、自分では気づいていなかったけれど、僕が力を入れていたのは、「開発をするための環境や道具を、自分で作ること」でした。記憶だけでは分からなかった自分の強みを、データから発見できました。","この経験から、AIは人間の苦手な部分を補ってくれる、とても強力な道具だと実感しました。記憶が曖昧でも、記録を整理して事実を引き出すことができる。自分一人では難しかった振り返りも、AIと一緒ならできるようになりました。","そして、企業に就職できるかどうかに関係なく、個人開発なら、自分で考えて、自分で仕組みを作り続けることができます。これからも、自分の経験を分析して、次の仕事に使える形へ変えていきたいと思っています。","この分析ツールは、「ムショチカ」という名前でリポジトリを作り、公開しています。","ご清聴ありがとうございました。"];const main=document.getElementById('main');const audio=document.getElementById('audio');audio.src=AUDIO_URL;const spans=[];PARAS.forEach(t=>{const d=document.createElement('p');d.className='line';[...t].forEach(c=>{const s=document.createElement('span');s.textContent=c;d.appendChild(s);spans.push(s)});main.appendChild(d)});let running=false,start=0;function fmt(x){x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}function tick(t){if(!running)return;const p=Math.min(1,(t-start)/180000);document.getElementById('timer').textContent=fmt(180-p*180);const i=Math.min(spans.length-1,Math.floor(p*spans.length));spans.forEach((s,k)=>s.className=k<i?'done':k===i?'cursor':'');if(p<1)requestAnimationFrame(tick);else running=false}document.getElementById('start').onclick=()=>{if(running){running=false;audio.pause();return}running=true;start=performance.now()-((audio.currentTime||0)*1000);audio.currentTime=0;audio.play().catch(()=>{});requestAnimationFrame(tick)};document.getElementById('reset').onclick=()=>{running=false;audio.pause();audio.currentTime=0;spans.forEach(s=>s.className='');document.getElementById('timer').textContent='3:00'};
</script></body></html>
